name: Routing regression
on:
  push:
    branches: [fix/routing-aware-placement]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Placement-feedback regression
        run: python -m unittest discover -s tests -p 'test_placement_feedback.py' -v
      - name: Karl AUDIO hole-graph regression
        run: python -m unittest discover -s tests -p 'test_hole_router.py' -v
      - name: End-to-end automatic AUDIO placement and routing
        run: python benchmark_audio_feedback.py --attempts 8 --timeout 45 --out /tmp/route-mate-audio-autorouted.json
      - name: Publish verified AUDIO board
        uses: actions/upload-artifact@v4
        with:
          name: audio-autorouted
          path: /tmp/route-mate-audio-autorouted.json
          if-no-files-found: error

  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install GUI dependencies
        run: python -m pip install -r requirements-gui.txt
      - name: Compile GUI and bridge
        run: python -m py_compile gui/main.py solve/desktop_integration.py
      - name: Test real MOTO solve in headless Qt window
        run: python -m unittest discover -s tests -p 'test_gui_solve.py' -v
      - name: Test verified desktop adapter
        run: python -m unittest discover -s tests -p 'test_desktop_integration.py' -v
      - name: Full repository regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Render real solved MOTO board through production SVG bridge
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from solve.desktop_integration import solve_for_display
          from render.standalone_bridge import render_project_data

          project = json.loads(Path("benchmarks/moto/moto.json").read_text())
          result = solve_for_display(project, attempts=8)
          assert result["status"] == "ROUTED", result.get("errors")
          top, copper, log = render_project_data(result["project"])
          assert "<svg" in top and "<svg" in copper
          Path("/tmp/routemate-solved-moto-top.svg").write_text(top)
          Path("/tmp/routemate-solved-moto-copper.svg").write_text(copper)
          print("GUI_RENDER=PASS TOP_BYTES=%d COPPER_BYTES=%d" % (len(top), len(copper)))
          PY
      - name: Capture actual Route-Mate 1.38 board GUI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          from gui.main import RouteMateWindow, GUI_VERSION
          app = QApplication([])
          window = RouteMateWindow()
          window.project = json.loads(Path("benchmarks/moto/moto.json").read_text())
          window.project_path = Path("benchmarks/moto/moto.json")
          window.project_summary.setText("MOTO · 44 components · 35 nets")
          window._top_svg = Path("/tmp/routemate-solved-moto-top.svg").read_text()
          window._copper_svg = Path("/tmp/routemate-solved-moto-copper.svg").read_text()
          window._show_board(window._top_svg)
          window._set_board_summary(
              "Electrical PASS · 48 cuts · 38 jumpers · physical certification pending",
              level="pass",
          )
          window.checklist.update_states({key: "done" for key, _ in window.checklist.STAGES})
          window.resize(1440, 850)
          window.show()
          app.processEvents()
          target = Path("/tmp/route-mate-gui-v1.38.png")
          assert window.grab().save(str(target))
          assert target.stat().st_size > 25000
          print(f"GUI_PREVIEW=PASS VERSION={GUI_VERSION} FILE={target}")
          window.close()
          PY
      - name: Publish desktop GUI preview
        uses: actions/upload-artifact@v4
        with:
          name: route-mate-v1-38-gui-preview
          path: /tmp/route-mate-gui-v1.38.png
          if-no-files-found: error
      - name: Publish solved board-side SVGs
        uses: actions/upload-artifact@v4
        with:
          name: moto-solved-svg-views
          path: /tmp/routemate-solved-moto-*.svg
          if-no-files-found: error
