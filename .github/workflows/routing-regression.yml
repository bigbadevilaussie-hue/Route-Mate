name: Routing regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Multicore portfolio and two-candidate regression
        run: python -m unittest discover -s tests -p 'test_parallel_quick.py' -v
      - name: Hell Mode M1 independent occupancy characterization
        run: python -m unittest discover -s tests -p 'test_hellmode_*.py' -v
      - name: Hell Mode multi-seed cut + topology search on MOTOMIX
        run: |
          python -m hellmode.demo --moves 150 --seeds 3 --seed 1 --out /tmp/route-mate-hellmode-alpha-ci
          python - <<'PY'
          import json
          from pathlib import Path
          from hellmode.demo import _electrically_valid
          from hellmode.verify_layout import verify_layout
          folder = Path("/tmp/route-mate-hellmode-alpha-ci")
          report = json.loads((folder / "run.json").read_text())
          before, after = report["baseline"], report["best_exploratory"]
          winner = json.loads((folder / "best_electrical.json").read_text())
          assert before["electrical_pass"] and after["electrical_pass"]
          assert report["portfolio"]["seeds_tested"] == 3
          assert report["portfolio"]["total_moves_requested"] == 450
          assert any(x["moves_cut_accepted"] or x["moves_topology_accepted"]
                     for x in report["portfolio"]["seeds"])
          assert report["moves_cut_proposed"] > 0
          assert not report["record_eligible"] and not report["physical_pass"]
          assert after["excess_gap_occupancy"] <= before["excess_gap_occupancy"]
          assert _electrically_valid(winner)
          assert verify_layout(winner)["record_eligible"] is False
          assert (folder / "baseline_solved.json").exists()
          assert (folder / "history.csv").exists()
          assert not (folder / "best_solved.json").exists()
          print("ALPHA_MOTOMIX_CUT_PORTFOLIO=PASS", "winning_seed",
                report["portfolio"]["winning_seed"], "jumper_count",
                before["wires"], "->", after["wires"], "cut_count",
                before["cuts"], "->", after["cuts"], "congestion",
                before["excess_gap_occupancy"], "->", after["excess_gap_occupancy"])
          PY
      - name: Prove three separate Quick Solve processes
        run: python tools/smoke_process_pool.py
      - name: Placement-feedback regression
        run: python -m unittest discover -s tests -p 'test_placement_feedback.py' -v
      - name: Karl AUDIO hole-graph regression
        run: python -m unittest discover -s tests -p 'test_hole_router.py' -v
      - name: Validate both saved WR sidecars and 2.5D geometry
        run: |
          python -m unittest tests.test_geometry_sidecar_integration tests.test_assumed_25d_provenance tests.test_collector_geometry_assumptions tests.test_gui_edge_slide_search tests.test_slide_fit tests.test_capacitor_render_contract tests.test_nominal_pad_access tests.test_default_body_spacing -v
          python - <<'PY'
          import json
          from pathlib import Path
          from solve.verify import verify_project
          for fixture in (
              "benchmarks/audio/audio10wires38cuts.json",
              "benchmarks/moto/moto14wires30cuts.json",
          ):
              project = json.loads(Path(fixture).read_text())
              check = verify_project(project)
              print(f"WR_ELECTRICAL fixture={fixture} status={check['status']} "
                    f"shorts={check['counts']['short_groups']} "
                    f"opens={check['counts']['open_nets']} "
                    f"errors={check['errors'][:5]}", flush=True)
          PY
      - name: End-to-end automatic AUDIO placement and routing
        run: python benchmark_audio_feedback.py --attempts 8 --timeout 45 --out /tmp/route-mate-audio-autorouted.json
      - name: Publish verified AUDIO board
        uses: actions/upload-artifact@v4
        with:
          name: audio-autorouted
          path: /tmp/route-mate-audio-autorouted.json
          if-no-files-found: error

  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install GUI dependencies
        run: python -m pip install -r requirements-gui.txt
      - name: Compile GUI and bridge
        run: python -m py_compile gui/main.py solve/desktop_integration.py
      - name: Test real MOTO solve in headless Qt window
        run: python -m unittest discover -s tests -p 'test_gui_solve.py' -v
      - name: Test verified desktop adapter
        run: python -m unittest discover -s tests -p 'test_desktop_integration.py' -v
      - name: Full repository regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Render real solved MOTO board through production SVG bridge
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from solve.desktop_integration import solve_for_display
          from render.standalone_bridge import render_project_data

          project = json.loads(Path("benchmarks/moto/moto.json").read_text())
          result = solve_for_display(project, attempts=8)
          assert result["status"] == "ROUTED", result.get("errors")
          top, copper, log = render_project_data(result["project"])
          assert "<svg" in top and "<svg" in copper
          Path("/tmp/routemate-solved-moto-top.svg").write_text(top)
          Path("/tmp/routemate-solved-moto-copper.svg").write_text(copper)
          print("GUI_RENDER=PASS TOP_BYTES=%d COPPER_BYTES=%d" % (len(top), len(copper)))
          PY
      - name: Audit actual production capacitor SVG shapes against collector v3
        run: |
          python tools/audit_capacitor_renderer.py benchmarks/moto/motomix.json
          python tools/audit_capacitor_renderer.py benchmarks/audio/audio.json
      - name: Capture actual Route-Mate 1.41 board GUI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          from gui.main import RouteMateWindow, GUI_VERSION
          app = QApplication([])
          window = RouteMateWindow()
          window.project = json.loads(Path("benchmarks/moto/moto.json").read_text())
          window.project_path = Path("benchmarks/moto/moto.json")
          window.project_summary.setText("MOTO · 44 components · 35 nets")
          window._top_svg = Path("/tmp/routemate-solved-moto-top.svg").read_text()
          window._copper_svg = Path("/tmp/routemate-solved-moto-copper.svg").read_text()
          window._show_board(window._top_svg)
          window._set_board_summary(
              "Electrical PASS · 48 cuts · 38 jumpers · physical certification pending",
              level="pass",
          )
          window.checklist.update_states({key: "done" for key, _ in window.checklist.STAGES})
          window.resize(1440, 850)
          window.show()
          app.processEvents()
          target = Path("/tmp/route-mate-gui-v1.43.png")
          assert window.grab().save(str(target))
          assert target.stat().st_size > 25000
          print(f"GUI_PREVIEW=PASS VERSION={GUI_VERSION} FILE={target}")
          window.close()
          PY
      - name: Publish desktop GUI preview
        uses: actions/upload-artifact@v4
        with:
          name: route-mate-v1-43-gui-preview
          path: /tmp/route-mate-gui-v1.43.png
          if-no-files-found: error
      - name: Publish solved board-side SVGs
        uses: actions/upload-artifact@v4
        with:
          name: moto-solved-svg-views
          path: /tmp/routemate-solved-moto-*.svg
          if-no-files-found: error
