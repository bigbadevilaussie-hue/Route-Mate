name: MOTO automatic routing
on:
  push:
    branches: [fix/routing-aware-placement]
  pull_request:
  workflow_dispatch:
jobs:
  moto:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect blocked MOTO terminal escapes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import deque
          from solve.quick_fit import quick_fit
          from solve.hole_router import _static
          from solve.wire_keepout import vertical_gap_keepouts
          from solve.route import _terminals
          p=json.loads(Path("benchmarks/moto/moto.json").read_text())
          result=quick_fit(p)
          assert result["status"]=="PLACED",result
          p=result["project"]
          rows,cols,bodies,pin_net,nets,vreach=_static(p)
          wanted=next(n["id"] for n in p["nets"] if n["name"]=="net8")
          ts=nets[wanted]
          from collections import defaultdict
          obstacles=vertical_gap_keepouts(p,rows,cols)
          print("NET8_TERMINALS", [(v//cols,v%cols) for v in ts])
          for h in ts:
              r,c=divmod(h,cols)
              print("ESCAPE",r,c, "left",pin_net.get(h-1),"right",pin_net.get(h+1),
                    "vertical",[(k//cols,k%cols) for k,l in vreach.get(h,())],
                    "nearby obstructions",[(rr,sorted(obstacles.get((rr,c),()))) for rr in range(max(0,r-2),min(rows-1,r+2))])
          todo=deque([ts[0]]); seen=set(ts[:1])
          while todo:
              h=todo.popleft();r,c=divmod(h,cols)
              candidates=([h-1] if c else [])+([h+1] if c<cols-1 else [])
              candidates += [other for other,length in vreach.get(h,())
                  if not any((rr*cols+c) in pin_net for rr in range(min(r,other//cols)+1,max(r,other//cols)))]
              for other in candidates:
                  if other in seen or pin_net.get(other) not in (None,wanted): continue
                  seen.add(other);todo.append(other)
          print("NET8_REACHABLE",ts[1] in seen,"VISITED",len(seen),
                "reachable_cols",sorted({v%cols for v in seen}),
                "reachable_rows",sorted({v//cols for v in seen}))
          PY
      - name: Automatic MOTO placement routing and independent verification
        run: python benchmark_moto_feedback.py --attempts 24 --timeout 120 --out /tmp/route-mate-moto-autorouted.json --json
      - name: Publish verified MOTO board
        uses: actions/upload-artifact@v4
        with:
          name: moto-autorouted
          path: /tmp/route-mate-moto-autorouted.json
          if-no-files-found: error
