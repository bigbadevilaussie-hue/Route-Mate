name: MOTO automatic routing
on:
  push:
    branches: [fix/routing-aware-placement]
  pull_request:
  workflow_dispatch:
jobs:
  moto:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Automatic MOTO placement routing and independent verification
        run: python benchmark_moto_feedback.py --attempts 24 --timeout 120 --out /tmp/route-mate-moto-autorouted.json --json
      - name: Publish verified MOTO board
        uses: actions/upload-artifact@v4
        with:
          name: moto-autorouted
          path: /tmp/route-mate-moto-autorouted.json
          if-no-files-found: error
